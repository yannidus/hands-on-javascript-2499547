<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 800 400">
  <!-- Schematic route (not a map): Nyaruguru, Rwanda → United States. Export and U.S. steps are planned. -->
  <rect width="800" height="400" fill="#faf7f2"/>
  <g fill="none" stroke="#e6e0d6"><circle cx="400" cy="560" r="420"/><circle cx="400" cy="560" r="380"/><circle cx="400" cy="560" r="340"/></g>
  <path d="M640 290 C 560 70, 240 70, 160 230" fill="none" stroke="#b08d57" stroke-width="1.6" stroke-dasharray="4 7"/>
  <path d="M168 214 l-8 16 l17 -4" fill="none" stroke="#b08d57" stroke-width="1.6"/>
  <circle cx="640" cy="290" r="7" fill="#111110"/><circle cx="640" cy="290" r="15" fill="none" stroke="#111110" stroke-opacity=".25"/>
  <circle cx="160" cy="230" r="7" fill="#b08d57"/><circle cx="160" cy="230" r="15" fill="none" stroke="#b08d57" stroke-opacity=".35"/>
  <g font-family="Cormorant Garamond, Georgia, serif" fill="#111110">
    <text x="640" y="330" text-anchor="middle" font-size="26">Nyaruguru</text>
    <text x="160" y="270" text-anchor="middle" font-size="26">United States</text>
  </g>
  <g font-family="Manrope, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3" font-weight="600">
    <text x="640" y="350" text-anchor="middle" fill="#8a6b3c">RWANDA · ORIGIN</text>
    <text x="160" y="290" text-anchor="middle" fill="#8a6b3c">WHOLESALE PARTNERS · PLANNED</text>
    <text x="400" y="100" text-anchor="middle" fill="#6d6860">EVERY SIP TELLS A STORY</text>
  </g>
</svg>
